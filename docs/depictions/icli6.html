<h1>icli6</h1>
<p><a href="https://github.com/owngoal-dev/icli">owngoal-dev/icli</a> の iOS 6 (armv7) 移植版。ターミナルから端末を操作する CLI（OCR なし）。</p>
<ul>
<li>タップ/スワイプ/スクリーンショット、ボタン操作</li>
<li>文字入力（同梱の icli6kbd により日本語も一括入力）</li>
<li>アクセシビリティで UI 要素の検索・タップ</li>
<li>アプリ、クリップボード、ファイル、ログ、launchd、設定、キーチェーン等</li>
</ul>
<p>使い方: SSH で <code>icli --help</code></p>
<p>注意: インストール前から起動中のアプリは再起動してください。検証: iPod touch 5th / iOS 6.1.3</p>
</body></html>
